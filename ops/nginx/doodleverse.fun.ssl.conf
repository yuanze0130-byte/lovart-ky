server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name doodleverse.fun www.doodleverse.fun;

    ssl_certificate /etc/letsencrypt/live/doodleverse.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doodleverse.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/doodleverse.fun.ssl.log;
    error_log /www/wwwlogs/doodleverse.fun.ssl.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/doodleverse.fun;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /brand-assets/ {
        alias /www/wwwroot/doodleverse.fun-assets/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:6868;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
