limit_req_zone $binary_remote_addr zone=doodleverse_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=doodleverse_connections:10m;

server {
    listen 80;
    listen [::]:80;

    server_name doodleverse.cn www.doodleverse.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://doodleverse.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name 38.244.14.231;
    return 301 https://doodleverse.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.doodleverse.cn;

    ssl_certificate /etc/letsencrypt/live/doodleverse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doodleverse.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    return 301 https://doodleverse.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name doodleverse.cn;

    access_log /www/wwwlogs/lovart-ky.access.log;
    error_log /www/wwwlogs/lovart-ky.error.log;

    ssl_certificate /etc/letsencrypt/live/doodleverse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doodleverse.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    client_max_body_size 65m;
    client_body_timeout 60s;

    location ^~ /media/canvas/ {
        auth_request /_canvas_asset_auth;
        alias /www/storage/doodleverse/canvas/;
        autoindex off;
        add_header Cache-Control "private, max-age=3600" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /_canvas_asset_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/canvas-assets/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        limit_req zone=doodleverse_requests burst=80 nodelay;
        limit_req_status 429;
        limit_conn doodleverse_connections 30;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
