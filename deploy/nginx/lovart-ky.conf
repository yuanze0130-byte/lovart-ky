server {
    listen 80;
    listen [::]:80;

    server_name doodleverse.cn www.doodleverse.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://doodleverse.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name 38.244.14.231;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.doodleverse.cn;

    ssl_certificate /etc/letsencrypt/live/doodleverse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doodleverse.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://doodleverse.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name doodleverse.cn;

    access_log /www/wwwlogs/lovart-ky.access.log;
    error_log /www/wwwlogs/lovart-ky.error.log;

    ssl_certificate /etc/letsencrypt/live/doodleverse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doodleverse.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    location ^~ /media/canvas/ {
        alias /www/storage/doodleverse/canvas/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
